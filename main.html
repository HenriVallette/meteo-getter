<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Meteo Getter</title>
  <link
    rel="stylesheet"
    href="main.css"
  >
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
  >
  <script
    defer
    src="main.js"
  ></script>
</head>

<body>
  <div class="container">
    <div class="meteo-actuelle">
      <div class="temperature">
        <span class="temperature-reelle">20°C</span>
        <span class="temperature-ressentie">21°C ressenti</span>
      </div>
      <div class="pluie">
        <span class="material-icons">water_drop</span>
        <span>Aucune pluie dans l'heure</span>
      </div>
    </div>
    <div class="pluie-dans-l-heure">
      <span class="material-icons">water_drop</span>
    </div>
    <div id="prevision-journaliere"></div>
    <div id="prevision-semaine"></div>
  </div>
</body>

</html>
