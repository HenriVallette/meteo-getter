<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Meteo Getter</title>
  <link
    rel="stylesheet"
    href="main.css"
  >
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
  >
  <script src="config.js"></script>
  <script
    defer
    src="visual_functions.js"
  ></script>
  <script
    defer
    src="main.js"
  ></script>
</head>

<body>
  <span
    id="loading-message"
    class="material-symbols-outlined"
  >autorenew</span>
  <div class="container">
    <div id="meteo-actuelle">
      <div class="temperature-actuelle">
        <span class="temperature-reelle">20°C</span>
        <span class="temperature-ressentie">21°C ressenti</span>
      </div>
      <div class="temperature-journee">
        <span class="temperature-min">15°C</span>
        <span class="material-symbols-outlined">thermostat_arrow_down</span>
        <span class="temperature-max">25°C</span>
        <span class="material-symbols-outlined">thermostat_arrow_up</span>
      </div>
      <div id="pluie-dans-l-heure"></div>
    </div>
    <div id="prevision-journaliere"></div>
    <div id="prevision-semaine"></div>
  </div>
</body>

</html>
